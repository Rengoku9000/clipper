<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101017">
  <title>Clipper Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;650;700;750&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Clipper Studio overview"><span class="brand-icon" data-icon="scissors"></span><span>Clipper <small>Studio</small></span></a>
    <nav aria-label="Workspace">
      <a href="#overview" data-page="overview"><span data-icon="grid"></span>Overview</a>
      <a href="#workflow" data-page="workflow"><span data-icon="activity"></span>Workflow</a>
      <a href="#library" data-page="library"><span data-icon="film"></span>Clip library</a>
      <a href="#publishing" data-page="publishing"><span data-icon="send"></span>Publishing</a>
      <a href="#accounts" data-page="accounts"><span data-icon="link"></span>Accounts</a>
    </nav>
    <div class="sidebar-footer"><span class="led"></span><div>Local workspace<small>Clipper runs on this computer</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <span class="breadcrumb">Workspace <span>/</span> <b id="breadcrumb">Overview</b></span>
      <div class="top-actions">
        <span id="server-status" class="server-status"><span class="led"></span>Connecting</span>
        <button class="primary" id="start-capture"><span data-icon="plus"></span>Start capture</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="view">
        <div class="page-heading"><div><h1>Overview</h1><p>Follow your clips from live capture to publication.</p></div></div>
        <div class="empty panel">Loading workspace…</div>
      </div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
